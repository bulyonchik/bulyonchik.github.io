<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <!-- Нормальное отображение на телефонах -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- НАЗВАНИЕ ВКЛАДКИ БРАУЗЕРА -->
    <title>My Steam Accounts</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #ffffff;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    #243b50 0%,
                    #172433 30%,
                    #0d141c 65%,
                    #080c11 100%
                );

            padding: 55px 20px;
        }

        /* =========================================================
           ОСНОВНОЙ КОНТЕЙНЕР
           ========================================================= */

        .container {
            width: 100%;
            max-width: 850px;

            margin: 0 auto;
        }

        /* =========================================================
           ВЕРХНЯЯ ЧАСТЬ САЙТА
           ========================================================= */

        header {
            text-align: center;

            margin-bottom: 50px;
        }

        /*
        ============================================================
        АВАТАР САЙТА

        Сейчас там буква S.

        Если захочешь поставить свою картинку:
        замени содержимое <div class="site-avatar">
        на:

        <img src="ССЫЛКА_НА_КАРТИНКУ">

        ============================================================
        */

        .site-avatar {
            width: 115px;
            height: 115px;

            margin: 0 auto 22px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #66c0f4,
                    #1b6ca8
                );

            font-size: 43px;
            font-weight: bold;

            box-shadow:
                0 0 35px rgba(102, 192, 244, 0.25);

            border: 2px solid rgba(255,255,255,0.08);
        }

        .site-title {
            font-size: 38px;

            letter-spacing: 5px;

            margin-bottom: 12px;

            text-transform: uppercase;
        }

        .site-subtitle {
            color: #8f98a0;

            font-size: 14px;

            letter-spacing: 3px;

            text-transform: uppercase;
        }

        /* =========================================================
           КАРТОЧКИ АККАУНТОВ
           ========================================================= */

        .accounts {
            display: flex;

            flex-direction: column;

            gap: 18px;
        }

        .account {
            position: relative;

            display: flex;

            align-items: center;

            padding: 20px;

            min-height: 105px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    rgba(27, 40, 56, 0.96),
                    rgba(17, 27, 36, 0.96)
                );

            border: 1px solid rgba(102, 192, 244, 0.12);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.25);

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        /* Светящаяся полоска слева */

        .account::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 4px;

            border-radius: 12px 0 0 12px;

            background: #66c0f4;

            opacity: 0;
